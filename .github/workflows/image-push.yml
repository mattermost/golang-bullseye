name: Build and Push Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  DOCKER_REGISTRY_REPO: "mattermost/golang-bullseye"      

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

jobs:
  verify-templating:
    name: Verify Templating
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - run: ./apply-templates.sh
      - run: git diff --exit-code

  build-image:
    name: Build and Push Image
    needs: verify-templating
    runs-on: ubuntu-22.04
    steps:
      - name: checkout-repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Determine version and registry
        id: config
        run: |
          if [[ "${{ github.ref }}" == refs/heads/main ]]; then
            VERSION="tip"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Extract full version from tag (e.g., v1.24.10 -> 1.24.10)
            TAG_NAME="${{ github.ref_name }}"
            VERSION="${TAG_NAME#v}"
          else
            echo "Error: Unexpected ref ${{ github.ref }}"
            exit 1
          fi

          # Look for existing major_minor version in versions.json
          if [[ "$VERSION" == "tip" ]]; then
            MAJOR_MINOR="$VERSION"
          else
            MAJOR_MINOR=$(jq -r --arg v "$VERSION" 'to_entries[] | select(.value.version == $v) | .key' versions.json)
            # Verify version exists in versions.json
            if [[ -z "$MAJOR_MINOR" ]]; then
              echo "Error: Version '$VERSION' not found in versions.json"
              echo "Available versions:"
              jq -r 'to_entries[] | if .key == "tip" then "tip" else .value.version end' versions.json              
              exit 1
            fi
          fi
          
          echo "major_minor=$MAJOR_MINOR" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Generate Dockerfiles
        run: ./apply-templates.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ steps.config.outputs.major_minor }}/bullseye
          file: ${{ steps.config.outputs.major_minor }}/bullseye/Dockerfile
          tags: ${{ env.DOCKER_REGISTRY_REPO }}:${{ steps.config.outputs.version }}
          push: false
          load: true

      - name: Smoke test
        run: |
          image="${{ env.DOCKER_REGISTRY_REPO }}:${{ steps.config.outputs.version }}"
          echo "Testing $image..."
          docker run --rm "$image" go version
          echo "Image golang-bullseye smoke test passed"

      - name: Login to registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          username: matterbuild
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ steps.config.outputs.major_minor }}/bullseye
          file: ${{ steps.config.outputs.major_minor }}/bullseye/Dockerfile
          tags: ${{ env.DOCKER_REGISTRY_REPO }}:${{ steps.config.outputs.version }}
          push: true
